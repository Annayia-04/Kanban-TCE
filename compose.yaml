# Flowboard en production.
# L'image est publiee sur GHCR par .github/workflows/docker.yml.
#
#   docker compose pull && docker compose up -d
#
# Le port n'est expose que sur la boucle locale : c'est le proxy d'authentification
# (oauth2-proxy, nginx, Caddy, Cloudflare Tunnel...) qui doit joindre l'application.

services:
  flowboard:
    # main par defaut ; mets FLOWBOARD_TAG=dev pour suivre la branche de dev.
    image: ghcr.io/annayia-04/kanban-tce:${FLOWBOARD_TAG:-main}
    container_name: flowboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - flowboard-data:/data
    environment:
      KANBAN_DATA_DIR: /data
      # Production : aucun jeu de démonstration au premier lancement.
      KANBAN_SEED: ${KANBAN_SEED:-empty}
      # SSO : KANBAN_AUTH_MODE=google (intégré) ou proxy, via un fichier .env en production.
      KANBAN_AUTH_MODE: ${KANBAN_AUTH_MODE:-none}
      KANBAN_AUTH_HEADER: ${KANBAN_AUTH_HEADER:-x-auth-request-email}
      KANBAN_AUTH_DOMAINS: ${KANBAN_AUTH_DOMAINS:-}
      # SSO Google (KANBAN_AUTH_MODE=google) — voir README, section « Déploiement derrière un SSO ».
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KANBAN_SESSION_SECRET: ${KANBAN_SESSION_SECRET:-}
      KANBAN_PUBLIC_URL: ${KANBAN_PUBLIC_URL:-}
      # Optionnel : extraction par IA
      KANBAN_LLM_API_KEY: ${KANBAN_LLM_API_KEY:-}
      KANBAN_LLM_MODEL: ${KANBAN_LLM_MODEL:-}

volumes:
  flowboard-data:
